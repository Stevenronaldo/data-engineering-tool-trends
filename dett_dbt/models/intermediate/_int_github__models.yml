models:
  - name: int_commits_weekly
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, week]
    columns:
      - name: repo
        data_tests:
          - not_null
      - name: week
        data_tests:
          - not_null

  - name: int_forks_weekly
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, week]
    columns:
      - name: repo
        data_tests:
          - not_null
      - name: week
        data_tests:
          - not_null

  - name: int_releases_weekly
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, week]
    columns:
      - name: repo
        data_tests:
          - not_null
      - name: week
        data_tests:
          - not_null

  - name: int_release_gaps
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, id]
    columns:
      - name: repo
        data_tests:
          - not_null
      - name: id
        data_tests:
          - not_null
      - name: published_at
        data_tests:
          - not_null
      - name: days_since_previous_release
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

