models:
  - name: stg_raw_github__commits
    description: "One row per key, deduplicated by keeping the newest loaded_at."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, sha]
    columns:
      - name: repo
        description: "One row per key, deduplicated by keeping the newest loaded_at."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('repo_labels')
                field: repo
      - name: sha
        data_tests:
          - not_null
      - name: committed_at
        data_tests:
        - not_null

  - name: stg_raw_github__forks
    description: "One row per key, deduplicated by keeping the newest loaded_at."
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns: [repo, id]
    columns:
    - name: repo 
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('repo_labels')
              field: repo
    - name: id
      data_tests:
        - not_null
    - name: created_at
      data_tests:
        - not_null

  - name: stg_raw_github__releases
    description: "One row per key."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, id]
    columns:
      - name: repo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('repo_labels')
                field: repo
      - name: id
        data_tests:
          - not_null


  - name: stg_raw_github__stargazers
    description: "One row per key, deduplicated by keeping the newest loaded_at. The raw week is Unix seconds, converted to a timestamp. The current week is not cut off here."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, week]
    columns:
      - name: repo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('repo_labels')
                field: repo
      - name: week
        data_tests:
          - not_null
      - name: star_count
        data_tests:
          - not_null
