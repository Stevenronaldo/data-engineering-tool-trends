sources:
  - name: raw_github

    database: data-engineering-tool-trends
    schema: raw_github
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 2, period: day}
    tables:
      - name: commits
      - name: forks
      - name: releases
      - name: stargazers_history